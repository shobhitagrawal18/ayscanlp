<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Brand Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .heading {
            background-color: #0045ff;
            padding: 15px;
            text-align: center;
            color: white;
            font-weight: bold;
            border-radius: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 100%;
            overflow-x: auto;
        }
        .grid-container a {
            display: block;
        }
        .grid-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1 class="heading">Tap Brand & Browse Collections</h1>
