<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 100%;
            overflow-x: auto;
        }
        .grid-container a {
            display: block;
        }
        .grid-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1>Tap Brand & Browse Collections</h1>
    <div class="grid-container">
        <a href="https://thehouseofrare.com/pages/rare-rabbit?utm_medium=ADYOGI&utm_campaign=blusmartscanner" target="_blank"><img src="assets/6a.png" alt="RareRabbit"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/8a.png" alt="Raymond"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/10a.png" alt="Brand 3"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/12a.png" alt="Brand 4"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/14a.png" alt="Brand 5"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/16b.png" alt="Brand 6"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/18a.png" alt="Brand 7"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/20a.png" alt="Brand 8"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/22a.png" alt="Brand 9"></a>
        <a href="https://www.raymond.com" target="_blank"><img src="assets/24a.png" alt="Brand 10"></a>
    </div>
</body>
</html>
