<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background-color: #F0F0F0;
          background-image: url("https://www.transparenttextures.com/patterns/fabric-plaid.png");
        }
        .image-container {
            padding: 0px;
            width: 500px;
            height: 260px;
            object-fit: cover;
        }
        .heading {
            background-color: #0045ff;
            padding: 15px;
            text-align: center;
            color: white;
            font-weight: bold;
            border-radius: 10px;
        }
        .row.g-3 {
            --bs-gutter-y: 4px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="heading">Tap Brand & Browse Latest Collection</h2>
        <div class="row g-3 justify-content-center" style = "padding: 10 px">
            <div class="col-6 col-md-2 image-container">
                <a href="https://thehouseofrare.com/pages/rare-rabbit?utm_medium=ADYOGI&utm_campaign=blusmartscanner" target="_blank">
                    <img src="assets/6a.png" alt="Rare Rabbit" class="img-fluid rounded">
                </a>
            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://myraymond.com/collections?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/8a.png" alt="Raymond" class="img-fluid rounded">
                </a>
            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://www.manyavar.com/en-in/men/all-products?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/10a.png" alt="Manyavar" class="img-fluid rounded">
                </a>
            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://www.shoppersstop.com?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/12a.png" alt="Shoppersstop" class="img-fluid rounded">
                </a>
            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://drvaidyas.com?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/14a.png" alt="Dr Vaidyas" class="img-fluid rounded">
                </a>
            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://superdry.in?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/16b.png" alt="Superdry" class="img-fluid rounded">
                </a>
            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://thehouseofrare.com/pages/rareism?utm_medium=ADYOGI&utm_campaign=blusmartscanner">

            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://www.bewakoof.com?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/20a.png" alt="Bewakoof" class="img-fluid rounded">
                </a>
            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://wrogn.com/collections/view-all?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/22b.png" alt="Wrogn" class="img-fluid rounded">

            </div>
            <div class="col-6 col-md-2 image-container">
                <a href="https://beinghumanclothing.com?utm_medium=ADYOGI&utm_campaign=blusmartscanner">
                    <img src="assets/24a.png" alt="Being Human" class="img-fluid rounded">
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
