<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Collection</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0YFJC8D8K4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0YFJC8D8K4');

      // Function to track link clicks
      function trackLinkClick(brand) {
        // Prevent potential XSS by sanitizing the brand name
        const sanitizedBrand = String(brand).replace(/[<>&'"]/g, '');

        gtag('event', 'click', {
          'event_category': 'Brand Link',
          'event_label': sanitizedBrand,
          'transport_type': 'beacon'
        });
      }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-bottom: 20px;
        }
        .heading {
            background-color: #0045ff;
            padding: 15px;
            text-align: center;
            color: white;
            font-weight: bold;
            border-radius: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 10px;
            max-width: 100%;
            overflow-x: auto;
        }
        .grid-container a {
            display: block;
        }
        .grid-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>

<body>
    <h2 class="heading">Tap, explore & shop at our partner sites</h2>
    <div class="grid-container">
        <a href="https://thehouseofrare.com/collections/rare-rabbit-men-new-arrivals?utm_source=ADYOGI&utm_medium=blusmart&utm_campaign=blusmartscanner"
           target="_blank"
           onclick="trackLinkClick('RareRabbit'); return true;">
            <img src="assets/6a.png" alt="RareRabbit">
        </a>
        <a href="https://myraymond.com/collections?utm_source=ADYOGI&utm_medium=blusmart&utm_campaign=blusmartscanner"
           target="_blank"
           onclick="trackLinkClick('Raymond'); return true;">
            <img src="assets/8a.png" alt="Raymond">
        </a>
        <a href="https://www.manyavar.com/en-in/men/all-products?utm_source=ADYOGI&utm_medium=blusmart&utm_campaign=blusmartscanner"
           target="_blank"
           onclick="trackLinkClick('Manyavar'); return true;">
            <img src="assets/10a.png" alt="Manyavar">
        </a>
        <a href="https://www.shoppersstop.com?utm_source=ADYOGI&utm_medium=blusmart&utm_campaign=blusmartscanner"
           target="_blank"
           onclick="trackLinkClick('ShopperStops'); return true;">
            <img src="assets/12a.png" alt="ShopperStops">
        </a>
        <a href="https://thehouseofrare.com/pages/rareism?utm_source=ADYOGI&utm_medium=blusmart&utm_campaign=blusmartscanner"
           target="_blank"
           onclick="trackLinkClick('Rareism'); return true;">
            <img src="assets/18a.png" alt="Rareism">
        </a>
        <a href="https://gant.in/?utm_source=ADYOGI&utm_medium=blusmart&utm_campaign=blusmartscanner"
           target="_blank"
           onclick="trackLinkClick('Gant'); return true;">
            <img src="assets/gant.jpg" alt="Gant">
        </a>
    </div>
</body>
</html>
